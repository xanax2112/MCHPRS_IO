[package]
name = "mchprs_network"
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
readme.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mchprs_proc_macros = { path = "../proc_macros" }
mchprs_text = { path = "../text" }
hematite-nbt = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
byteorder = { workspace = true }
tracing = { workspace = true }
bitvec = { workspace = true }

# 基岩版（Bedrock）协议栈，见 BACKLOG.md BUG-032。
# 上游 bedrock-rs 以 vendored 副本引入（vendor/bedrock-rs），因为我们对它有 5 处本地补丁，
# 细节见 docs/BEDROCK-SPIKE-STATUS.md 与 docs/bedrock-integration.md。
bedrock = { path = "../../vendor/bedrock-rs/bedrock", default-features = false, features = [
    "network-tokio",
    "protocol-unknown",
    "protocol-v766",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# Bedrock 会话层需要：NBT 编解码（生物群系/实体标识表是 NBT 文件）、玩家 UUID
nbtx = { git = "https://github.com/bedrock-crustaceans/nbtx" }
uuid = { version = "1", features = ["v4"] }
