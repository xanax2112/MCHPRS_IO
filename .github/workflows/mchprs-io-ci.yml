name: MCHPRS_IO CI

# 上游自带的 build.yml / ci.yml 盯的是 `master` 分支（本仓库是 `main`），一直不会触发；
# 这个文件是 MCHPRS_IO 自己的流水线，只跑我们维护的路径。
# APK 不在 CI 里构建：真包必须嵌入 aarch64 二进制，由本地（手机 Termux）
# 的 app/build.sh 打包，成品直接提交在 app/mchprs.apk。

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 网络层单测（含基岩协议 / NBT）
        run: cargo test -p mchprs_network --lib --features bedrock

      - name: 网络层单测（不编基岩版：验证插座可独立编译）
        run: cargo test -p mchprs_network --lib

      - name: 核心层单测（含 server / plot）
        run: cargo test -p mchprs_core --lib

  build:
    name: Build (x86_64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release（带基岩版）
        run: cargo build --release --features bedrock

      - name: cargo build --release（纯 Java，验证插头可拔）
        run: cargo build --release

      - name: 冒烟：二进制能打印版本后退出
        run: ./target/release/mchprs --version

      - uses: actions/upload-artifact@v4
        with:
          name: mchprs-x86_64-linux
          path: target/release/mchprs
          if-no-files-found: error
